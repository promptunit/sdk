name: 'AI Cost Analyzer'
description: 'Comments on pull requests that add expensive AI models, with how PromptUnit could lower the cost.'
author: 'PromptUnit'

branding:
  icon: 'dollar-sign'
  color: 'yellow'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'index.js'
